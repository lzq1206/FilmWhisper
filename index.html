<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Film Whisper · 胶片模拟</title>
    <meta name="description" content="在浏览器本地完成胶片模拟、照片调整和导出。" />
    <meta name="theme-color" content="#0c0d0f" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css?v=20261001-curves" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <header class="topbar">
        <div class="brand-lockup">
          <button class="icon-button brand-mark" id="brandMenu" aria-label="打开菜单"><span>F</span></button>
          <div>
            <div class="brand-name">Film Whisper</div>
            <div class="brand-subtitle">胶片模拟工作台</div>
          </div>
        </div>
        <div class="top-actions">
          <button class="text-button" data-action="undo" aria-label="撤销"><span class="icon">↶</span><span class="hide-small">撤销</span></button>
          <button class="text-button" data-action="redo" aria-label="重做"><span class="icon">↷</span><span class="hide-small">重做</span></button>
          <span class="top-divider"></span>
          <button class="text-button" data-action="before" aria-label="查看原图"><span class="icon">◐</span><span class="hide-small">原图</span></button>
          <button class="text-button" data-action="reset" aria-label="重置全部设置"><span class="icon">↺</span><span class="hide-small">重置</span></button>
          <button class="primary-button" data-action="export"><span class="icon">⇩</span>导出</button>
          <button class="icon-button" id="themeToggle" aria-label="切换明暗主题">☼</button>
        </div>
      </header>

      <div class="mobile-toolbar">
        <button class="compact-button" data-action="toggle-left">☰ <span>胶片库</span></button>
        <div class="mobile-mode" id="mobileMode">调整</div>
        <button class="compact-button" data-action="toggle-right">☷ <span>二次调色</span></button>
      </div>

      <div class="editor-layout">
        <aside class="side-panel left-panel" id="leftPanel">
          <div class="panel-header">
            <div>
              <div class="eyebrow">胶片库</div>
              <h1>胶片库</h1>
            </div>
            <button class="icon-button mobile-close" data-action="toggle-left" aria-label="关闭胶片库">×</button>
          </div>
          <div class="panel-tabs" role="tablist" aria-label="胶片库导航">
            <button class="panel-tab active" data-library-tab="films">胶片</button>
            <button class="panel-tab" data-library-tab="history">历史</button>
            <button class="panel-tab" data-library-tab="saved">收藏</button>
          </div>
          <div class="library-tools">
            <label class="search-box"><span>⌕</span><input id="filmSearch" type="search" placeholder="搜索胶片" aria-label="搜索胶片" /></label>
          </div>
          <div class="library-content" id="libraryContent">
            <div class="film-grid" id="filmGrid"></div>
            <div class="history-list hidden" id="historyList"></div>
            <div class="saved-list hidden" id="savedList"></div>
          </div>
          <div class="library-footer">
            <button class="ghost-wide" data-action="open"><span>＋</span>打开图片</button>
            <div class="tiny-note">图片仅在本地浏览器中处理</div>
          </div>
        </aside>

        <section class="workspace" id="workspace">
          <div class="canvas-stage" id="canvasStage">
            <div class="empty-state" id="emptyState">
              <div class="empty-icon">◎</div>
              <h2>放入一张照片</h2>
              <p>拖入图片，或从设备打开</p>
              <button class="primary-button" data-action="open">打开图片</button>
              <div class="format-hint">JPG · PNG · WebP · TIFF · DNG · NEF · CR3 · ARW · 3FR</div>
            </div>
            <canvas id="previewCanvas" aria-label="照片预览"></canvas>
            <div class="crop-overlay hidden" id="cropOverlay" aria-label="手动裁剪区域">
              <div class="crop-selection" id="cropSelection"></div>
            </div>
            <div class="compare-line hidden" id="compareLine"><span>原图</span><span>编辑后</span></div>
            <div class="stage-toast" id="stageToast"></div>
          </div>
          <div class="workspace-footer">
            <div class="zoom-controls">
              <button class="icon-button" data-action="zoom-out" aria-label="缩小">−</button>
              <span id="zoomLabel">适合</span>
              <button class="icon-button" data-action="zoom-in" aria-label="放大">＋</button>
            </div>
            <div class="footer-center" id="renderStatus">等待图片</div>
            <div class="footer-actions">
              <button class="subtle-button" data-action="compare">对比</button>
              <button class="subtle-button" data-action="fullscreen">全屏</button>
            </div>
          </div>
        </section>

        <aside class="side-panel right-panel" id="rightPanel">
          <div class="panel-header inspector-header">
            <div>
              <div class="eyebrow" id="modePanelEyebrow">调整</div>
              <h1 id="modePanelTitle">调整</h1>
            </div>
            <button class="icon-button mobile-close" data-action="toggle-right" aria-label="关闭二次调色">×</button>
          </div>
          <div class="profile-row">
            <div><span class="profile-dot"></span><span id="activeFilmLabel">ACROS 100</span></div>
            <button class="mini-button" data-action="favorite">☆</button>
          </div>
          <div class="inspector-note">主配置负责一次调色；右侧参数为二次调色，默认保持中性。</div>
          <nav class="mode-tabs inspector-mode-tabs" aria-label="调色模式">
            <button class="mode-tab active" data-mode="develop">调整</button>
            <button class="mode-tab" data-mode="print">输出</button>
            <button class="mode-tab" data-mode="crop">裁剪</button>
          </nav>
          <div class="inspector-scroll" id="inspectorScroll">
            <section class="inspector-section open" data-section="histogram">
              <button class="section-heading" type="button"><span>直方图</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <svg id="rgbHistogram" class="rgb-histogram" viewBox="0 0 256 100" role="img" aria-label="RGB 三色直方图"><path data-hist-channel="0"/><path data-hist-channel="1"/><path data-hist-channel="2"/></svg>
                <div class="histogram-legend"><span>阴影</span><span>中间调</span><span>高光</span></div>
              </div>
            </section>
            <section class="inspector-section open" data-section="light">
              <button class="section-heading" type="button"><span>明暗</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <div class="control-row"><label for="exposure">曝光</label><output data-output="exposure">0.00</output><input id="exposure" data-field="exposure" type="range" min="-3" max="3" step="0.01" value="0" /></div>
                <div class="control-row"><label for="contrast">对比度</label><output data-output="contrast">0</output><input id="contrast" data-field="contrast" type="range" min="-100" max="100" step="1" value="0" /></div>
                <div class="control-row"><label for="highlights">高光</label><output data-output="highlights">0</output><input id="highlights" data-field="highlights" type="range" min="-100" max="100" step="1" value="0" /></div>
                <div class="control-row"><label for="shadows">阴影</label><output data-output="shadows">0</output><input id="shadows" data-field="shadows" type="range" min="-100" max="100" step="1" value="0" /></div>
              </div>
            </section>
            <section class="inspector-section" data-section="curves">
              <button class="section-heading" type="button"><span>曲线</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <div class="select-row"><label for="curveChannel">通道</label><select id="curveChannel"><option value="master">整体明度（RGB）</option><option value="red">红色 R</option><option value="green">绿色 G</option><option value="blue">蓝色 B</option></select></div>
                <svg id="curveEditor" class="curve-editor" viewBox="0 0 260 260" tabindex="0" role="group" aria-label="点击添加点，拖动调整，Delete 删除选中点">
                  <defs><linearGradient id="curveRamp"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
                  <rect x="18" y="18" width="224" height="224" fill="#141619"/>
                  <path class="curve-grid" d="M18 18H242V242H18Z M74 18V242 M130 18V242 M186 18V242 M18 74H242 M18 130H242 M18 186H242"/>
                  <path class="curve-identity" d="M18 242L242 18"/>
                  <path id="curvePath" fill="none" stroke-width="2"/>
                  <g id="curvePoints"></g><rect x="18" y="247" width="224" height="5" fill="url(#curveRamp)"/>
                </svg>
                <div class="curve-coordinates"><label>输入 <input id="curveInput" type="number" min="0" max="255" step="1" value="0"/></label><label>输出 <input id="curveOutput" type="number" min="0" max="255" step="1" value="0"/></label></div>
                <div class="button-grid"><button class="tool-button" id="curveReset">重置此通道</button><button class="tool-button" id="curvesReset">重置全部曲线</button></div>
                <div class="crop-help">点击添加点 · 拖动调整 · 双击或 Delete 删除中间点</div>
              </div>
            </section>
            <section class="inspector-section open" data-section="color">
              <button class="section-heading" type="button"><span>色彩</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <div class="control-row"><label for="temperature">色温</label><output data-output="temperature">0</output><input id="temperature" data-field="temperature" type="range" min="-100" max="100" step="1" value="0" /></div>
                <div class="control-row"><label for="tint">色调</label><output data-output="tint">0</output><input id="tint" data-field="tint" type="range" min="-100" max="100" step="1" value="0" /></div>
                <div class="control-row"><label for="saturation">饱和度</label><output data-output="saturation">0</output><input id="saturation" data-field="saturation" type="range" min="-100" max="100" step="1" value="0" /></div>
                <div class="control-row"><label for="vibrance">自然饱和度</label><output data-output="vibrance">0</output><input id="vibrance" data-field="vibrance" type="range" min="-100" max="100" step="1" value="0" /></div>
              </div>
            </section>
            <section class="inspector-section" data-section="film">
              <button class="section-heading" type="button"><span>主配置</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <div class="select-row"><label for="filmFormat">格式</label><select id="filmFormat" data-field="filmFormat"><option>35mm</option><option>120</option><option>4×5</option><option>Instax Mini</option><option>Instax Square</option><option>Instax Wide</option><option>Super 8</option></select></div>
                <div class="control-row"><label for="filmAmount">主配置强度</label><output data-output="filmAmount">100</output><input id="filmAmount" data-field="filmAmount" type="range" min="0" max="100" step="1" value="100" /></div>
                <div class="control-row"><label for="push">增感 / 减感</label><output data-output="push">0</output><input id="push" data-field="push" type="range" min="-2" max="2" step="1" value="0" /></div>
                <div class="control-row"><label for="bleach">漂白旁路</label><output data-output="bleach">0</output><input id="bleach" data-field="bleach" type="range" min="0" max="100" step="1" value="0" /></div>
                <div class="control-row"><label for="age">老化</label><output data-output="age">0</output><input id="age" data-field="age" type="range" min="0" max="50" step="1" value="0" /></div>
              </div>
            </section>
            <section class="inspector-section" data-section="grain">
              <button class="section-heading" type="button"><span>颗粒</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <div class="control-row"><label for="grain">数量</label><output data-output="grain">0</output><input id="grain" data-field="grain" type="range" min="0" max="100" step="1" value="0" /></div>
                <div class="control-row"><label for="grainSize">大小</label><output data-output="grainSize">35</output><input id="grainSize" data-field="grainSize" type="range" min="10" max="100" step="1" value="35" /></div>
                <div class="control-row"><label for="grainColor">彩色颗粒</label><output data-output="grainColor">50</output><input id="grainColor" data-field="grainColor" type="range" min="0" max="100" step="1" value="50" /></div>
              </div>
            </section>
            <section class="inspector-section" data-section="halation">
              <button class="section-heading" type="button"><span>晕光</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <div class="control-row"><label for="halation">晕光</label><output data-output="halation">0</output><input id="halation" data-field="halation" type="range" min="0" max="100" step="1" value="0" /></div>
                <div class="control-row"><label for="halationReturn">回返光</label><output data-output="halationReturn">25</output><input id="halationReturn" data-field="halationReturn" type="range" min="0" max="100" step="1" value="25" /></div>
                <div class="control-row"><label for="haloHue">晕光色相</label><output data-output="haloHue">12</output><input id="haloHue" data-field="haloHue" type="range" min="0" max="60" step="1" value="12" /></div>
              </div>
            </section>
            <section class="inspector-section" data-section="lens">
              <button class="section-heading" type="button"><span>镜头</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <div class="control-row"><label for="vignette">暗角</label><output data-output="vignette">0</output><input id="vignette" data-field="vignette" type="range" min="0" max="100" step="1" value="0" /></div>
                <div class="control-row"><label for="distortion">畸变</label><output data-output="distortion">0</output><input id="distortion" data-field="distortion" type="range" min="-100" max="100" step="1" value="0" /></div>
                <div class="select-row"><label for="filter">滤镜</label><select id="filter" data-field="filter"><option value="无">无</option><option value="Warm 1/8">暖调 1/8</option><option value="Warm 1/4">暖调 1/4</option><option value="Black Mist 1/8">黑柔 1/8</option><option value="Glimmer 1/4">星芒 1/4</option><option value="Fog 1/8">雾化 1/8</option></select></div>
              </div>
            </section>
            <section class="inspector-section" data-section="frame">
              <button class="section-heading" type="button"><span>边框</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <div class="select-row"><label for="frameStyle">边框</label><select id="frameStyle" data-field="frameStyle"><option value="black">1、黑色边框</option><option value="white">2、白色边框</option><option value="gray">3、灰色边框</option><option value="polaroid">4、宝丽来式</option><option value="square">5、方形边框</option></select></div>
                <div class="control-row"><label for="frameSize">边框大小</label><output data-output="frameSize">0</output><input id="frameSize" data-field="frameSize" type="range" min="0" max="100" step="1" value="0" /></div>
              </div>
            </section>
            <section class="inspector-section" data-section="screen">
              <button class="section-heading" type="button"><span>屏幕转换</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <div class="select-row"><label for="negativeViewing">负片查看</label><select id="negativeViewing" data-field="negativeViewing"><option value="Reference Exposure">参考曝光</option><option value="Graded Print">打印校色</option><option value="Auto Levels">自动平衡</option></select></div>
                <div class="select-row"><label for="viewingIlluminant">观看光源</label><select id="viewingIlluminant" data-field="viewingIlluminant"><option value="D50">D50</option><option value="Daylight 5500 K">日光 5500 K</option><option value="Tungsten 2856 K">钨丝灯 2856 K</option></select></div>
                <div class="select-row"><label for="paperGrade">纸张反差</label><select id="paperGrade" data-field="paperGrade"><option value="Reference">参考</option><option value="Soft">柔和</option><option value="Hard">硬调</option></select></div>
                <div class="control-row"><label for="screenExposure">屏幕曝光</label><output data-output="screenExposure">0</output><input id="screenExposure" data-field="screenExposure" type="range" min="-3" max="3" step="0.01" value="0" /></div>
                <div class="select-row"><label for="enlarger">放大设备</label><select id="enlarger" data-field="enlarger"><option value="Diffuser">散射式</option><option value="Condenser">聚光式</option><option value="Light Box">灯箱</option><option value="Scanner">扫描仪</option></select></div>
                <div class="control-row"><label for="printerPreflash">预闪</label><output data-output="printerPreflash">0</output><input id="printerPreflash" data-field="printerPreflash" type="range" min="0" max="100" value="0" /></div>
              </div>
            </section>
            <section class="inspector-section" data-section="crop">
              <button class="section-heading" type="button"><span>裁剪与旋转</span><span class="section-chevron">⌄</span></button>
              <div class="section-body crop-grid">
                <div class="select-row"><label for="aspect">比例</label><select id="aspect" data-field="aspect"><option value="free">自由</option><option value="1">1 : 1</option><option value="1.5">3 : 2</option><option value="1.7778">16 : 9</option><option value="0.8">4 : 5</option><option value="0.5625">9 : 16</option></select></div>
                <div class="crop-help">在主图上拖动选择裁剪区域</div>
                <button class="tool-button" data-action="reset-crop">重置裁剪区域</button>
                <div class="control-row"><label for="straighten">校正</label><output data-output="straighten">0°</output><input id="straighten" data-field="straighten" type="range" min="-10" max="10" step="0.1" value="0" /></div>
                <div class="button-grid"><button class="tool-button" data-action="rotate-left">↺ 90°</button><button class="tool-button" data-action="rotate-right">↻ 90°</button><button class="tool-button" data-action="flip-h">↔ 翻转</button><button class="tool-button" data-action="fit">适合画布</button></div>
              </div>
            </section>
            <section class="inspector-section" data-section="output">
              <button class="section-heading" type="button"><span>输出</span><span class="section-chevron">⌄</span></button>
              <div class="section-body">
                <div class="select-row"><label for="outputFormat">格式</label><select id="outputFormat" data-field="outputFormat"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option><option value="image/tiff">TIFF（16 位）</option></select></div>
                <div class="control-row"><label for="quality">质量</label><output data-output="quality">92</output><input id="quality" data-field="quality" type="range" min="50" max="100" step="1" value="92" /></div>
                <div class="select-row"><label for="outputMedium">输出介质</label><select id="outputMedium" data-field="outputMedium"><option value="Photo">照片</option><option value="Print">打印</option><option value="Screen">屏幕</option><option value="Light Box">灯箱</option><option value="Scanner">扫描仪</option></select></div>
              </div>
            </section>
          </div>
          <div class="inspector-footer"><button class="ghost-wide" data-action="reset">重置全部设置</button></div>
        </aside>
      </div>
      <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="移动端工作区">
        <button type="button" data-mobile-nav="films"><span>▦</span><small>胶片</small></button>
        <button type="button" class="active" data-mobile-nav="develop"><span>◒</span><small>调整</small></button>
        <button type="button" data-mobile-nav="print"><span>▤</span><small>输出</small></button>
        <button type="button" data-mobile-nav="crop"><span>⌗</span><small>裁剪</small></button>
      </nav>
      <div class="drawer-scrim" id="drawerScrim" data-action="close-drawers"></div>
      <input id="fileInput" type="file" accept="image/*,.tif,.tiff,.dng,.nef,.nrw,.cr2,.cr3,.arw,.raf,.rw2,.orf,.pef,.srw,.3fr,.iiq,.x3f,.raw" hidden />
    </div>
    <script src="film-profiles.js?v=20261001-acr-measured"></script>
    <script src="curves.js?v=20261001-curves"></script>
    <script src="app.js?v=20261001-curves"></script>
  </body>
</html>
